name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rust-ci:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-ci.yml@v1
    with:
      # so clippy sees the tests too
      check-args: "--all-targets"
      # Stable rustfmt, not the workflow's default nightly: this repo has no
      # rustfmt.toml and no nightly-only options, so the check should agree
      # with what `cargo fmt` gives a contributor.
      fmt-toolchain: ""
