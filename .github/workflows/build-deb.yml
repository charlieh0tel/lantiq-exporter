name: Build Debian Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deb:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    # Scoped to this job.  At workflow level it would also be granted to
    # the dispatch job below, which authenticates with its own PAT and
    # writes nothing here.
    permissions:
      contents: write

  trigger-apt-repo:
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger APT repo rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          # Requires an APT_REPO_TOKEN secret on this repository; until it
          # is added this job fails and the APT repo picks the release up
          # on its daily cron instead.
          token: ${{ secrets.APT_REPO_TOKEN }}
          repository: charlieh0tel/apt-repo
          event-type: update-apt-repo
