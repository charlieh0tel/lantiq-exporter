# Netdata: /etc/netdata/go.d/prometheus.conf  (or: edit via `sudo ./edit-config go.d/prometheus.conf`)
# Netdata's go.d "prometheus" collector scrapes any OpenMetrics endpoint and
# auto-charts every ont_* series. After editing, restart netdata.
jobs:
  - name: lantiq_ont
    url: http://127.0.0.1:9909/metrics
    # scrape as often as you like — the exporter serves cached values, so this
    # does NOT hit the stick over SSH each time (it polls on its own --interval).
    autodetection_retry: 5
